name: Bug report
description: Something doesn't work as expected
labels: [ "bug" ]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: "e.g. 2.0.0 or dev-2.x"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      description: Which provider or integration is involved, if any?
      options:
        - Not provider-specific
        - OpenAI
        - Google
        - Mistral
        - OVH
        - Other OpenAI-compatible endpoint
        - MCP / OpenAPI tools
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet helps a lot. Please remove any API key or secret.
      render: php
    validations:
      required: false

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "e.g. 8.4.1"
    validations:
      required: false
