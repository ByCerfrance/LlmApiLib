name: Feature request
description: Suggest an idea or an improvement
labels: [ "enhancement" ]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What would you like to do that isn't possible or easy today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work? A rough idea is fine.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workaround you are using today?
    validations:
      required: false
